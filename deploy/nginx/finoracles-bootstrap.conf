# FinOracles — TEMPORARY HTTP-only virtual host. Only needed for the fallback certificate path
# (HTTP-01 after DNS points at the VPS, docs/DOMAIN-SSL.md "Path B"). The recommended path (DNS-01)
# does not use this file. Replace it with finoracles.conf as soon as the certificate exists.
#
# Placeholders: CANONICAL_HOST and REDIRECT_HOST, as described in finoracles.conf.

server {
    listen 80;
    listen [::]:80;
    server_name CANONICAL_HOST REDIRECT_HOST;
    server_tokens off;

    access_log /var/log/nginx/finoracles.access.log;
    error_log  /var/log/nginx/finoracles.error.log warn;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Proxy "";
        proxy_read_timeout 120s;
    }
}
