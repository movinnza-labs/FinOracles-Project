# FinOracles — Nginx virtual host (host) -> Next.js + Payload container on 127.0.0.1:3000.
# Install: /etc/nginx/sites-available/finoracles.conf, symlinked into sites-enabled. See docs/DOMAIN-SSL.md.
#
# Placeholders (substitute with the sed command in docs/DOMAIN-SSL.md, then `nginx -t`):
#   CANONICAL_HOST  the host the live site uses today, e.g. example.com OR www.example.com.
#                   Must equal the host in NEXT_PUBLIC_SERVER_URL so every URL stays unchanged.
#   REDIRECT_HOST   the other variant (www.example.com OR example.com); 301-redirected to CANONICAL_HOST.
# Certificate: one Let's Encrypt certificate named "finoracles" covering both hosts
#   (/etc/letsencrypt/live/finoracles/), issued with --cert-name finoracles.
#
# Included inside http {} by /etc/nginx/nginx.conf (sites-enabled/*).

# Brute-force protection for the CMS login (Payload also locks an account after 5 failures).
limit_req_zone $binary_remote_addr zone=finoracles_login:10m rate=10r/m;

upstream finoracles_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── Catch-all: requests for the bare IP or unknown host names get no site ───────────────
# (stops host-header abuse and duplicate content on http(s)://<VPS_IP>/).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ── HTTP: ACME challenge, everything else -> https://CANONICAL_HOST (one hop, path + query kept)
server {
    listen 80;
    listen [::]:80;
    server_name CANONICAL_HOST REDIRECT_HOST;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://CANONICAL_HOST$request_uri;
    }
}

# ── HTTPS: REDIRECT_HOST -> CANONICAL_HOST ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name REDIRECT_HOST;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/finoracles/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finoracles/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:finoracles_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=86400" always;
    return 301 https://CANONICAL_HOST$request_uri;
}

# ── HTTPS: the site ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CANONICAL_HOST;
    server_tokens off;

    # Site logs (rotated daily by Ubuntu's /etc/logrotate.d/nginx, which covers /var/log/nginx/*.log).
    access_log /var/log/nginx/finoracles.access.log;
    error_log  /var/log/nginx/finoracles.error.log warn;

    ssl_certificate     /etc/letsencrypt/live/finoracles/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finoracles/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:finoracles_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: start at 1 day; raise to 31536000 after a week of stable HTTPS. No includeSubDomains
    # (other subdomains, e.g. mail, may not be HTTPS) and no preload.
    # The app already sends nosniff, Referrer-Policy, X-Frame-Options and Permissions-Policy
    # (next.config.ts), so they are not repeated here.
    add_header Strict-Transport-Security "max-age=86400" always;

    # Admin media uploads (default 1m would reject images).
    client_max_body_size 25m;

    # ── Reverse-proxy headers (inherited by every location below) ──
    # Host / X-Forwarded-Host / X-Forwarded-Proto: Next.js Server Actions compare the browser's
    # Origin with these, and Payload builds absolute URLs and checks CSRF against serverURL.
    # Client-supplied values are always overwritten, never trusted.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    # The enquiry rate limiter (src/lib/actions/enquiry.ts) uses the LAST X-Forwarded-For entry.
    # Setting it to the connecting address discards any spoofed entries from the client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    # httpoxy mitigation.
    proxy_set_header Proxy "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Payload's login cookie (payload-token) is HttpOnly + SameSite=Lax but not Secure by default.
    # Mark every cookie the app sets as Secure so it is never sent over plain HTTP. No code change.
    proxy_cookie_flags ~ secure;

    # If Cloudflare proxying is enabled later, uncomment and keep the ranges current
    # (https://www.cloudflare.com/ips/) so $remote_addr is the visitor, not Cloudflare:
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 173.245.48.0/20;
    # ...

    location = /api/users/login {
        limit_req zone=finoracles_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://finoracles_app;
    }

    location / {
        proxy_pass http://finoracles_app;
    }
}
