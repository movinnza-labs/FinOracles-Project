# Nginx site for a Hostinger VPS. Replace finoracles.com with your domain, then:
#   sudo cp deploy/hostinger/nginx.conf /etc/nginx/sites-available/finoracles
#   sudo ln -s /etc/nginx/sites-available/finoracles /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d finoracles.com -d www.finoracles.com   # adds HTTPS + redirect
#
# Next.js (PM2, 127.0.0.1:3000) serves everything: pages, /admin, /api and uploaded media
# (/api/media/file/...). Nginx only terminates TLS, proxies and caches immutable assets.

upstream finoracles_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name finoracles.com www.finoracles.com;

  # Image uploads in the admin (Media collection).
  client_max_body_size 25m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Hashed build assets never change for a given URL.
  location /_next/static/ {
    proxy_pass http://finoracles_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://finoracles_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }
}
