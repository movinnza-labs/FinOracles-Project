# systemd drop-in: restart Nginx automatically if it ever exits unexpectedly.
# (Ubuntu's nginx.service starts at boot but has no restart policy.)
# Install:
#   sudo install -D -m 644 deploy/systemd/nginx-restart.conf /etc/systemd/system/nginx.service.d/restart.conf
#   sudo systemctl daemon-reload
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5s
